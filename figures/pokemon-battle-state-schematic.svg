  <title id="title">Battle-state schematic</title>
  <desc id="desc">A Pokemon battle state represented as twelve object tokens, six per side, with active Pokemon and bench Pokemon encoded together.</desc>
  <rect width="1040" height="600" fill="#ffffff" />
  <defs>
