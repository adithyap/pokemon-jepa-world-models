<svg viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pokemon JEPA learning target</title>
  <desc id="desc">A sample input state and target for next-turn HP prediction and winner prediction.</desc>
  <rect width="1040" height="560" fill="#ffffff" />
  <defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#64748b" />
  </marker>
</defs>

  <text x="520" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900" fill="#1f2933">One Training Example</text>
  <text x="520" y="74" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a">The model is not given the next move. It sees the current board and learns the next HP vector plus the final winner.</text>

  <rect x="40" y="112" width="340" height="360" rx="10" fill="#eaf2ff" stroke="#1f6feb" stroke-width="2" />
  <text x="210" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#1f2933">Input x_t</text>
  <text x="210" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6b7a">Turn 6 snapshot from a replay</text>
<text x="210" y="192" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6b7a">12 slots, shown here as a compact excerpt</text>
  <rect x="70" y="222" width="130" height="120" rx="8" fill="#ffffff" stroke="#1f6feb" stroke-width="2" />
<text x="82" y="243" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#1f6feb">P1 active</text>
<text x="135.0" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#1f2933">Delphox</text>
<text x="135.0" y="308" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#1f6feb">HP 100%</text>
<rect x="84" y="318" width="102" height="7" rx="3.5" fill="#e2e8f0" /><rect x="84" y="318" width="102" height="7" rx="3.5" fill="#1f6feb" />
<text x="135.0" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#5f6b7a">boosted</text>
  <rect x="220" y="222" width="130" height="120" rx="8" fill="#ffffff" stroke="#1f6feb" stroke-width="2" />
<text x="232" y="243" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#1f6feb">P2 active</text>
<text x="285.0" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#1f2933">Bellibolt</text>
<text x="285.0" y="308" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#1f6feb">HP 100%</text>
<rect x="234" y="318" width="102" height="7" rx="3.5" fill="#e2e8f0" /><rect x="234" y="318" width="102" height="7" rx="3.5" fill="#1f6feb" />
<text x="285.0" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#5f6b7a">leftovers</text>
  <rect x="70" y="352" width="130" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
<text x="82" y="373" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#5f6b7a">P1 bench</text>
<text x="135.0" y="400" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#1f2933">Florges</text>
<text x="135.0" y="438" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#1f6feb">HP 90%</text>
<rect x="84" y="448" width="102" height="7" rx="3.5" fill="#e2e8f0" /><rect x="84" y="448" width="91.8" height="7" rx="3.5" fill="#1f6feb" />
  <rect x="220" y="352" width="130" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
<text x="232" y="373" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#5f6b7a">P2 bench</text>
<text x="285.0" y="400" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#1f2933">Appletun</text>
<text x="285.0" y="438" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#1f6feb">HP 83%</text>
<rect x="234" y="448" width="102" height="7" rx="3.5" fill="#e2e8f0" /><rect x="234" y="448" width="84.66" height="7" rx="3.5" fill="#1f6feb" />

  <path d="M 380 292 L 470 292" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />

  <rect x="470" y="202" width="155" height="180" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2" />
  <text x="547.5" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#1f2933">Encoder</text>
  <text x="547.5" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a">self-attention</text>
<text x="547.5" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a">over 12 slots</text>
  <rect x="500" y="322" width="95" height="38" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1" />
  <text x="547.5" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#9a3412">latent z</text>

  <path d="M 625 292 L 710 292" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />

  <rect x="710" y="112" width="290" height="360" rx="10" fill="#e8f6ef" stroke="#1f7a4d" stroke-width="2" />
  <text x="855" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#1f2933">Targets</text>
  <text x="742" y="185" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900" fill="#1f7a4d">Next-turn HP vector y_hp</text>
  <rect x="742" y="204" width="226" height="122" rx="8" fill="#ffffff" stroke="#a7d7bc" stroke-width="1" />
  <text x="758" y="229" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933">P1 Delphox: 100 -&gt; 49  (delta -51)</text>
<text x="758" y="249" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933">P1 Florges: 90 -&gt; 90  (delta 0)</text>
<text x="758" y="269" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933">P2 Bellibolt: 100 -&gt; 46  (delta -54)</text>
<text x="758" y="289" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933">P2 Appletun: 83 -&gt; 83  (delta 0)</text>
<text x="758" y="309" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933">... eight more slots</text>
  <text x="742" y="370" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900" fill="#b42318">Auxiliary winner label</text>
  <rect x="742" y="389" width="226" height="48" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
  <text x="855" y="419" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900" fill="#b42318">winner_p1 = 1</text>

  <text x="520" y="520" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#5f6b7a">JEPA pressure: a good representation must preserve damage, recovery, switching pressure, and long-horizon outcome.</text>
</svg>